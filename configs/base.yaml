# 基础实验设置
seed: 42
image_size: [256, 256]
num_classes: 1        # 二值分割：皮损前景1，背景0
in_channels: 3        # dermoscopy RGB 图像

# 训练超参（全部模型统一）
batch_size: 4
epochs: 100
lr: 1.0e-4
optimizer: "adamw"
scheduler: "cosine"
loss_type: "bce_dice"
patience: 15             # 验证集 Dice 连续 15 轮不涨则早停

# 数据集路径 & 划分文件
data_root: "./data"
raw_dir: "./data/raw"
processed_dir: "./data/processed"
split_json: "./data/splits/train_val_test.json"   # 各模型只认这一份划分，不各自重新切

# 输出保存路径
checkpoint_dir: "./checkpoints"
result_dir: "./results"
log_dir: "./results/logs"
curve_dir: "./results/curves"
pred_dir: "./results/preds"
figure_dir: "./results/figures"

# 训练开关
amp: false 
save_best: true
save_last: false
visual_pred: true    # 评估时保存预测叠加图